# Netlify: statische Astro-Seite. Die Content-Security-Policy schreibt der
# Build nach dist/_headers (integrationen/sicherheits-header.mjs), weil sie
# vom Anfrage-Ziel (PUBLIC_ANFRAGE_URL) und den Inline-Skript-Hashes abhängt.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"

# Deploy-Previews und Branch-Deploys sind immer Vorschau: noindex + Band.
[context.deploy-preview.environment]
  PUBLIC_VORSCHAU = "1"

[context.branch-deploy.environment]
  PUBLIC_VORSCHAU = "1"

# ---------------------------------------------------------------- Header
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(self \"https://www.youtube-nocookie.com\" \"https://my.matterport.com\"), gyroscope=(self \"https://www.youtube-nocookie.com\" \"https://my.matterport.com\"), autoplay=(self \"https://www.youtube-nocookie.com\" \"https://my.matterport.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\" \"https://my.matterport.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\"), picture-in-picture=(self \"https://www.youtube-nocookie.com\"), xr-spatial-tracking=(self \"https://my.matterport.com\"), camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), browsing-topics=()"

# Gehashte Dateien (JS, CSS, Schriften, Bilder) ändern nie ihren Inhalt.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pdf/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ------------------------------------------------------------ Weiterleitungen
# Die alte Seite war eine einzige Seite (index.html mit Ankern).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.htm"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

# Alte Galerie-Bildpfade (images/galerie/…) → neue Galerie
[[redirects]]
  from = "/images/galerie/*"
  to = "/galerie/"
  status = 301

# Die Buchungsmails verweisen auf „/kontakt#anfahrt"
[[redirects]]
  from = "/kontakt"
  to = "/#anfahrt"
  status = 301

[[redirects]]
  from = "/kontakt/"
  to = "/#anfahrt"
  status = 301

[[redirects]]
  from = "/impressum.html"
  to = "/impressum/"
  status = 301

[[redirects]]
  from = "/datenschutz.html"
  to = "/datenschutz/"
  status = 301
